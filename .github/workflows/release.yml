name: Release

# Push a version tag (git tag -a v0.5.0 -m "..." && git push --follow-tags)
# to build Brim, publish a GitHub Release with the DMG, and update the Homebrew tap.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.5.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      TAP_REPO: ${{ github.repository_owner }}/homebrew-brim
      # Only a yes/no here: the token itself is given to the tap step alone.
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' }}
    steps:
      # Third-party actions are pinned to exact commits so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Work out the version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build and package
        run: scripts/make-dmg.sh "$VERSION"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Installing
          Download **Brim-${{ env.VERSION }}.dmg**, open it and drag Brim to Applications.
          Brim isn't notarized, so the first launch is blocked once: open **System Settings → Privacy & Security** and click **Open Anyway**.
          NOTES

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          name: Brim ${{ env.VERSION }}
          body_path: notes.md
          files: |
            dist/Brim-${{ env.VERSION }}.dmg
            dist/Brim-${{ env.VERSION }}.dmg.sha256

      - name: Update Homebrew tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          SHA="$(cat "dist/Brim-$VERSION.dmg.sha256")"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 .*/  sha256 \"$SHA\"/" \
            Casks/brim.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Brim $VERSION"
          git push
